name: Isolated cold Split View characterization
on:
  push:
    branches: [diagnostic/split-cold-restart-20261115]
permissions:
  contents: read
jobs:
  split-cold-characterization:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      ARCIFY_PAIRED_RUN_MODE: split-cold-diagnostic
      ARCIFY_TEST_HEAD: ${{ github.sha }}
    steps:
      - name: Check out exact Arcify head (not the synthetic PR merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: arcify
      - name: Check out reviewed Spotlight companion
        uses: actions/checkout@v4
        with:
          repository: calvwng/arcify-spotlight
          ref: c3e4e4d374136e608d447716c0321b32b2aa8cfb
          persist-credentials: false
          path: arcify-spotlight
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            arcify/package-lock.json
            arcify/scripts/paired-chrome-runtime/package-lock.json
            arcify-spotlight/package-lock.json
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --prefix arcify
          npm ci --prefix arcify/scripts/paired-chrome-runtime
          npm ci --prefix arcify-spotlight
      - name: Verify isolated driver and sandbox defaults (no browser launch)
        run: npm test --prefix arcify/scripts/paired-chrome-runtime
      - name: Validate isolated diagnostic and source scope
        working-directory: arcify
        run: |
          node --test scripts/paired-chrome-split-cold-diagnostic.test.mjs scripts/paired-chrome-split-cold-run-plan.test.mjs
          node scripts/build-split-cold-diagnostic-runner.mjs
          node --check scripts/.split-cold-paired-chrome-smoke.mjs
          git diff --exit-code
      - name: Build the exact paired revisions
        run: |
          git -C arcify rev-parse HEAD
          git -C arcify-spotlight rev-parse HEAD
          npm run build --prefix arcify
          npm run build --prefix arcify-spotlight
      - name: Require supported Chrome using the explicit official HTTPS package route
        working-directory: arcify
        # Only this positive-capability job may update the existing stable package.
        # Use verified TLS to the exact Google URL; no redirects or source/key imports.
        # Keep host policy, normal apt/browser sandboxing,
        # channel: chrome, and every later package/process/sandbox assertion.
        run: |
          set -o pipefail
          mkdir -p test-results/split-cold-only
          node scripts/paired-chrome-native-split-vendor-update.mjs 2>&1 | tee test-results/split-cold-only/chrome-update.log
      - name: Characterize one restore-enabled cold Split View restart after independent setup
        working-directory: arcify
        # channel: chrome uses the installed stable browser and its existing
        # AppArmor allowance. The fixture requires actual Namespace/PID/network/
        # seccomp sandbox evidence before installing either extension.
        # Never manually install/repair/chmod/chown a privileged helper or change policy.
        # Do not add sandbox/web-security disabling flags or modify runner policy.
        # A browser launch denial must remain a failed run with its original error.
        run: |
          set -o pipefail
          mkdir -p test-results/split-cold-only
          xvfb-run --auto-servernum node scripts/.split-cold-paired-chrome-smoke.mjs ../arcify-spotlight 2>&1 | tee test-results/split-cold-only/runner.log
      - name: Upload success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-cold-characterization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            arcify/test-results/split-cold-only/
            arcify/test-results/paired-chrome-native-split/chrome-update.json
          if-no-files-found: warn
          retention-days: 14

