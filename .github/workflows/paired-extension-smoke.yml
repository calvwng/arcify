          ref: 56cf43b1f773eab0e7d82d0645b9a48927e05616
          persist-credentials: false
          path: arcify-spotlight
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            arcify/package-lock.json
            arcify/scripts/paired-chrome-runtime/package-lock.json
            arcify-spotlight/package-lock.json
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --prefix arcify
          npm ci --prefix arcify/scripts/paired-chrome-runtime
          npm ci --prefix arcify-spotlight
      - name: Verify isolated driver and sandbox defaults (no browser launch)
        run: npm test --prefix arcify/scripts/paired-chrome-runtime
      - name: Build the exact paired revisions
        run: |
          git -C arcify rev-parse HEAD
          git -C arcify-spotlight rev-parse HEAD
          npm run build --prefix arcify
          npm run build --prefix arcify-spotlight
      - name: Exercise Favorite native close, reload and restart in an independent fresh profile
        working-directory: arcify
        # channel: chrome uses the image's installed stable browser and its existing
        # AppArmor allowance. The fixture requires actual Namespace/PID/network/
        # seccomp sandbox evidence before installing either extension.
        # Never install/repair/chmod/chown a privileged helper or change policy.
        # Do not add sandbox/web-security disabling flags or modify runner policy.
        # A browser launch denial must remain a failed run with its original error.
        run: |
          set -o pipefail
          mkdir -p test-results/paired-chrome-favorite-lifecycle
          xvfb-run --auto-servernum npm run test:paired-chrome -- ../arcify-spotlight 2>&1 | tee test-results/paired-chrome-favorite-lifecycle/runner.log
      - name: Upload success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-chrome-favorite-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: arcify/test-results/paired-chrome-favorite-lifecycle/
          if-no-files-found: warn
          retention-days: 14

  # Independent mandatory acceptance job; full49/lifecycle5/native-split4 remain required.
  # All eight selected cases use a fresh profile, with no browser update or case retry.
  appearance-actions:
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'little-arc'
    timeout-minutes: 20
    env:
      CI: 'true'
      ARCIFY_PAIRED_RUN_MODE: appearance-actions
      ARCIFY_TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      ARCIFY_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact Arcify head (not the synthetic PR merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: arcify
      - name: Check out reviewed Spotlight companion
        uses: actions/checkout@v4
        with:
          repository: calvwng/arcify-spotlight
          ref: 56cf43b1f773eab0e7d82d0645b9a48927e05616
          persist-credentials: false
          path: arcify-spotlight
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            arcify/package-lock.json
            arcify/scripts/paired-chrome-runtime/package-lock.json
            arcify-spotlight/package-lock.json
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --prefix arcify
          npm ci --prefix arcify/scripts/paired-chrome-runtime
          npm ci --prefix arcify-spotlight
      - name: Verify isolated driver and sandbox defaults (no browser launch)
        run: npm test --prefix arcify/scripts/paired-chrome-runtime
      - name: Build the exact paired revisions
        run: |
          git -C arcify rev-parse HEAD
          git -C arcify-spotlight rev-parse HEAD
          npm run build --prefix arcify
          npm run build --prefix arcify-spotlight
      - name: Exercise appearance, themes, recovery and initial actions in an independent fresh profile
        working-directory: arcify
        # channel: chrome uses the image's installed stable browser and its existing
        # AppArmor allowance. The fixture requires actual Namespace/PID/network/
        # seccomp sandbox evidence before installing either extension.
        # Never install/repair/chmod/chown a privileged helper or change policy.
        # Do not add sandbox/web-security disabling flags or modify runner policy.
        # A browser launch denial must remain a failed run with its original error.
        run: |
          set -o pipefail
          mkdir -p test-results/paired-chrome-appearance-actions
          xvfb-run --auto-servernum npm run test:paired-chrome -- ../arcify-spotlight 2>&1 | tee test-results/paired-chrome-appearance-actions/runner.log
      - name: Upload success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-chrome-appearance-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: arcify/test-results/paired-chrome-appearance-actions/
          if-no-files-found: warn
          retention-days: 14

  # Mandatory positive-capability job on its own runner. Missing APIs fail; never skip.
  native-split:
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'little-arc'
    timeout-minutes: 20
    env:
      CI: 'true'
      ARCIFY_PAIRED_RUN_MODE: native-split
      ARCIFY_TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      ARCIFY_PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact Arcify head (not the synthetic PR merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: arcify
      - name: Check out reviewed Spotlight companion
        uses: actions/checkout@v4
        with:
          repository: calvwng/arcify-spotlight
          ref: 56cf43b1f773eab0e7d82d0645b9a48927e05616
          persist-credentials: false
          path: arcify-spotlight
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            arcify/package-lock.json
            arcify/scripts/paired-chrome-runtime/package-lock.json
            arcify-spotlight/package-lock.json
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --prefix arcify
          npm ci --prefix arcify/scripts/paired-chrome-runtime
          npm ci --prefix arcify-spotlight
      - name: Verify isolated driver and sandbox defaults (no browser launch)
        run: npm test --prefix arcify/scripts/paired-chrome-runtime
      - name: Build the exact paired revisions
        run: |
          git -C arcify rev-parse HEAD
          git -C arcify-spotlight rev-parse HEAD
          npm run build --prefix arcify
          npm run build --prefix arcify-spotlight
      - name: Require supported Chrome using the explicit official HTTPS package route
        working-directory: arcify
        # Only this positive-capability job may update the existing stable package.
        # Use verified TLS to the exact Google URL; no redirects or source/key imports.
        # Keep host policy, normal apt/browser sandboxing,
        # channel: chrome, and every later package/process/sandbox assertion.
        run: |
          set -o pipefail
          mkdir -p test-results/paired-chrome-native-split
          node scripts/paired-chrome-native-split-vendor-update.mjs 2>&1 | tee test-results/paired-chrome-native-split/chrome-update.log
      - name: Exercise native Split View with real drag, keyboard and exact native pair evidence
        working-directory: arcify
        # channel: chrome uses the installed stable browser and its existing
        # AppArmor allowance. The fixture requires actual Namespace/PID/network/
        # seccomp sandbox evidence before installing either extension.
        # Never manually install/repair/chmod/chown a privileged helper or change policy.
        # Do not add sandbox/web-security disabling flags or modify runner policy.
        # A browser launch denial must remain a failed run with its original error.
        run: |
          set -o pipefail
          mkdir -p test-results/paired-chrome-native-split
          xvfb-run --auto-servernum npm run test:paired-chrome -- ../arcify-spotlight 2>&1 | tee test-results/paired-chrome-native-split/runner.log
      - name: Upload success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-chrome-native-split-${{ github.run_id }}-${{ github.run_attempt }}
          path: arcify/test-results/paired-chrome-native-split/
          if-no-files-found: warn
          retention-days: 14

  # Supplemental mandatory outcome on its own fresh runner/profile; no dependency.
  recovery-actions:
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.acceptance_scope != 'little-arc'
    timeout-minutes: 20
    env:
      CI: 'true'
      ARCIFY_PAIRED_RUN_MODE: recovery-actions
      ARCIFY_TEST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      ARCIFY_PR_HEAD: ${{ github.event.pull_request.head.sha }}
