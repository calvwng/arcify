name: Isolated pin-count readiness validation

on:
  push:
    branches: [diagnostic/pin-count-readiness-20261115]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser and system deps
        run: npx puppeteer browsers install chrome

      - name: Verify exact checkout and readiness contracts
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git rev-parse HEAD
          node --test tests/unit/pin-count-readiness.test.js

      - name: Run unchanged full E2E suite with stronger pin-count readiness
        run: |
          set -o pipefail
          mkdir -p test-results/pin-count-readiness
          npm test 2>&1 | tee test-results/pin-count-readiness/e2e.log
        env:
          CI: true

      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-count-readiness-node${{ matrix.node-version }}-${{ github.run_id }}
          path: |
            tests/e2e/screenshots/
            test-results/pin-count-readiness/
          if-no-files-found: ignore
          retention-days: 7
