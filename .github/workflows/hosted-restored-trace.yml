name: Isolated restored-match picker trace
on:
  push:
    branches: [diagnostic/restored-match-trace-20261117]
permissions:
  contents: read
concurrency:
  group: diagnostic-restored-match-trace-20261117
  cancel-in-progress: false
jobs:
  native-picker-trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked build and isolated browser driver
        run: |
          npm ci
          npm ci --prefix scripts/paired-chrome-runtime
          npm test --prefix scripts/paired-chrome-runtime
          node --test scripts/hosted-restored-trace/checks.test.mjs
      - name: Build and verify exact approved 62-file QA artifact
        env:
          VITE_ARCIFY_RESTORED_HINT_TRACE: 'true'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run build
          node --input-type=module -e "import{verifyDist}from'./scripts/hosted-restored-trace/checks.mjs';await verifyDist('./dist','./scripts/hosted-restored-trace/expected-dist.sha256')"
      - name: Verify and unpack official Chrome for Testing in runner temp
        run: |
          CFT_VERSION=157.0.8103.50
          CFT_DIR="$(mktemp -d "$RUNNER_TEMP/chrome-for-testing.XXXXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 "https://storage.googleapis.com/chrome-for-testing-public/$CFT_VERSION/linux64/chrome-linux64.zip" -o "$CFT_DIR/chrome.zip"
          printf '%s  %s\n' 'd17167bc092eb495a3b768c7467f27e35f625aa03834233a1663af67dcb668c9' "$CFT_DIR/chrome.zip" | sha256sum --check
          unzip -q "$CFT_DIR/chrome.zip" -d "$CFT_DIR"
          CFT_CHROME="$CFT_DIR/chrome-linux64/chrome"
          test -x "$CFT_CHROME"
          test ! -u "$CFT_CHROME"
          test ! -g "$CFT_CHROME"
          "$CFT_CHROME" --version
          printf 'ARCF_CFT_BINARY=%s\nARCF_CFT_VERSION=%s\n' "$CFT_CHROME" "$CFT_VERSION" >> "$GITHUB_ENV"
      - name: Require native display
        run: |
          test -x /usr/bin/xvfb-run
          node --check scripts/hosted-restored-trace/run.mjs
      - name: Run native picker baseline, real extension reload, and real browser restart
        run: |
          set -o pipefail
          mkdir -p test-results/hosted-restored-trace
          xvfb-run --auto-servernum node scripts/hosted-restored-trace/run.mjs 2>&1 | tee test-results/hosted-restored-trace/runner.log
      - name: Retain disposable lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-restored-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/hosted-restored-trace/
          retention-days: 7
          if-no-files-found: warn
