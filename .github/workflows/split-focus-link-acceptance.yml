name: Isolated explicit Split View focus-link acceptance
on:
  push:
    branches: [diagnostic/split-focus-link-rebuild-20261115]
permissions:
  contents: read
jobs:
  split-focus-link-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      ARCIFY_PAIRED_RUN_MODE: split-cold-diagnostic
      ARCIFY_TEST_HEAD: ${{ github.sha }}
    steps:
      - name: Check out exact Arcify head (not the synthetic PR merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: arcify
          fetch-depth: 0
      - name: Check out reviewed Spotlight companion
        uses: actions/checkout@v4
        with:
          repository: calvwng/arcify-spotlight
          ref: c3e4e4d374136e608d447716c0321b32b2aa8cfb
          persist-credentials: false
          path: arcify-spotlight
      - name: Verify exact reviewed source custody
        working-directory: arcify
        run: |
          set -o pipefail
          mkdir -p test-results/split-focus-link-acceptance
          node scripts/verify-focus-link-provenance.mjs ../arcify-spotlight 2>&1 | tee test-results/split-focus-link-acceptance/source-custody.log
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            arcify/package-lock.json
            arcify/scripts/paired-chrome-runtime/package-lock.json
            arcify-spotlight/package-lock.json
      - name: Install locked dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --prefix arcify
          npm ci --prefix arcify/scripts/paired-chrome-runtime
          npm ci --prefix arcify-spotlight
      - name: Verify isolated driver and sandbox defaults (no browser launch)
        run: npm test --prefix arcify/scripts/paired-chrome-runtime
      - name: Validate isolated diagnostic and source scope
        working-directory: arcify
        run: |
          node --test scripts/paired-chrome-split-cold-diagnostic.test.mjs scripts/paired-chrome-split-cold-run-plan.test.mjs scripts/paired-chrome-focus-link-acceptance.test.mjs scripts/paired-chrome-focus-link-generator.test.mjs scripts/focus-link-evidence.test.mjs
          node scripts/build-focus-link-acceptance-runner.mjs
          node --check scripts/.focus-link-paired-chrome-smoke.mjs
          git diff --exit-code
      - name: Build the exact paired revisions
        run: |
          git -C arcify rev-parse HEAD
          git -C arcify-spotlight rev-parse HEAD
          npm run build --prefix arcify
          npm run build --prefix arcify-spotlight
      - name: Require compatible preinstalled Chrome without installing or changing policy
        working-directory: arcify
        run: |
          mkdir -p test-results/split-focus-link-acceptance
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          import {CHROME_EXECUTABLE,inspectInstalledChromeRuntime,validateNamespaceLaunchEnvironment} from './scripts/paired-chrome-sandbox.mjs';
          validateNamespaceLaunchEnvironment(process.env,process.getuid?.());
          const runtime=await inspectInstalledChromeRuntime(CHROME_EXECUTABLE);
          await writeFile('test-results/split-focus-link-acceptance/preinstalled-chrome.json',JSON.stringify({imageVersion:process.env.ImageVersion,source:'read-only preinstalled runtime; no install/update',runtime},null,2));
          assert(Number(runtime.package.browserVersion.split('.')[0])>=155,'Preinstalled Chrome must support native Split View; no update fallback');
          NODE
      - name: Validate explicit focus-only link after unchanged cold characterization
        working-directory: arcify
        # channel: chrome uses the installed stable browser and its existing
        # AppArmor allowance. The fixture requires actual Namespace/PID/network/
        # seccomp sandbox evidence before installing either extension.
        # Never manually install/repair/chmod/chown a privileged helper or change policy.
        # Do not add sandbox/web-security disabling flags or modify runner policy.
        # A browser launch denial must remain a failed run with its original error.
        run: |
          set -o pipefail
          mkdir -p test-results/split-focus-link-acceptance
          xvfb-run --auto-servernum node scripts/.focus-link-paired-chrome-smoke.mjs ../arcify-spotlight 2>&1 | tee test-results/split-focus-link-acceptance/runner.log
      - name: Summarize strict separate outcomes
        if: always()
        working-directory: arcify
        run: node scripts/summarize-focus-link-evidence.mjs test-results/split-focus-link-acceptance/report.json
      - name: Upload success or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-focus-link-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: arcify/test-results/split-focus-link-acceptance/
          if-no-files-found: warn
          retention-days: 14

